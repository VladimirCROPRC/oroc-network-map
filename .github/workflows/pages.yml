name: Deploy map to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Configure optional Mapbox satellite
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          if [ -f dist/mapbox-satellite.js ]; then
            node -e 'require("fs").writeFileSync("dist/mapbox-config.json", JSON.stringify({accessToken:process.env.MAPBOX_PUBLIC_TOKEN||""}))'
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish map
        id: deployment
        uses: actions/deploy-pages@v4
