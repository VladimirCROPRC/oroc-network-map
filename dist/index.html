    async function getData(layer){if(raw.has(layer.id))return raw.get(layer.id);const response=await fetch(layer.file);if(!response.ok)throw new Error("Layer indisponibil");let data=layer.file.endsWith(".gz")?JSON.parse(await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).text()):await response.json();if(data.c)data={type:"FeatureCollection",features:data.c.map((item,index)=>({type:"Feature",id:String(index+1),properties:item[0],geometry:{type:item[2]?"MultiLineString":"LineString",coordinates:item[1]}}))};if(data.p)data={type:"FeatureCollection",features:data.p.map((item,index)=>({type:"Feature",id:String(index+1),properties:item[0],geometry:{type:"Point",coordinates:item[1]}}))};raw.set(layer.id,data);return data}

    function updateSiteLabels(){const group=visible.get("oroc-locations");if(!group)return;const center=map.getCenter(),bounds=map.getBounds();group.eachLayer(item=>{const point=item.getLatLng?.(),shouldShow=item._siteLabelText&&point&&bounds.contains(point)&&center.distanceTo(point)<=SITE_LABEL_RADIUS_M;if(shouldShow){if(!item.getTooltip?.())item.bindTooltip(item._siteLabelText,{permanent:true,direction:"right",offset:[8,0],className:"site-label"});item.openTooltip()}else if(item.getTooltip?.())item.unbindTooltip()})}

    function refreshFromMap(){if(!manifest||!searchCenter)return;const center=map.getCenter();searchArea({lat:center.lat,lng:center.lng},"Centrul hărții",{pin:false,fit:false})}
    function parseCoordinates(value){const m=value.trim().match(/^\s*(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)\s*$/);if(!m)return null;const lat=Number(m[1]),lng=Number(m[2]);return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null}
    async function locate(value){const coordinates=parseCoordinates(value);if(coordinates)return{center:coordinates,label:value};const url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ro&q="+encodeURIComponent(value),response=await fetch(url,{headers:{"Accept":"application/json"}});if(!response.ok)throw new Error("Serviciul de adrese nu răspunde");const results=await response.json();if(!results.length)throw new Error("Adresa nu a fost găsită");return{center:{lat:Number(results[0].lat),lng:Number(results[0].lon)},label:results[0].display_name}}
    const normalize=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    async function getSiteCodeIndex(){if(siteCodeIndex)return siteCodeIndex;const response=await fetch("site-codes.json");if(!response.ok)throw new Error("Lista codurilor de site nu este disponibilă");siteCodeIndex=await response.json();return siteCodeIndex}
    async function getSiteCodeShard(shard){if(siteCodeCache.has(shard.key))return siteCodeCache.get(shard.key);const response=await fetch(shard.file);if(!response.ok)throw new Error("Indexul codurilor de site nu este disponibil");const records=await response.json();siteCodeCache.set(shard.key,records);return records}
    function selectSite(record){siteResults.classList.remove("open");document.getElementById("site-code").value=record.c;const center={lat:record.p[1],lng:record.p[0]};searchArea(center,record.n).then(()=>lastSearchMarker?.openPopup())}
    function renderSiteResults(records){siteResults.innerHTML="";if(!records.length){siteResults.innerHTML='<button class="asset-result" type="button" disabled><strong>Nicio potrivire</strong><span>Încearcă un alt cod de site.</span></button>';siteResults.classList.add("open");return}records.forEach(record=>{const button=document.createElement("button");button.type="button";button.className="asset-result";button.setAttribute("role","option");button.innerHTML='<strong>'+esc(record.c)+'</strong><span>'+esc(record.n)+'</span>';button.addEventListener("click",()=>selectSite(record));siteResults.append(button)});siteResults.classList.add("open")}
    async function searchSite(value){const query=normalize(value).replace(/\s+/g,"");if(!query)throw new Error("Introdu un cod de site");const index=await getSiteCodeIndex(),prefix=query.slice(0,Math.min(2,query.length)),preferred=index.shards.filter(shard=>shard.key.startsWith(prefix)),remaining=index.shards.filter(shard=>!shard.key.startsWith(prefix)),ordered=[...preferred,...remaining],matches=[];for(const shard of ordered){const records=await getSiteCodeShard(shard);for(const record of records){if(normalize(record.c).includes(query)){matches.push(record);if(matches.length>=50)break}}if(matches.length>=50||query.length===5&&preferred.includes(shard))break}if(matches.length===1)selectSite(matches[0]);else renderSiteResults(matches);status.hidden=true}
    function render(filter=""){const root=document.getElementById("layers"),groups=new Map(),q=filter.trim().toLowerCase();manifest.layers.forEach(layer=>{if(q&&!layer.name.toLowerCase().includes(q)&&!layer.group.toLowerCase().includes(q))return;if(!groups.has(layer.group))groups.set(layer.group,[]);groups.get(layer.group).push(layer)});root.innerHTML="";[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([group,layers])=>{const details=document.createElement("details");details.open=!!q||group==="Camerete"||group==="Locatii";details.innerHTML='<summary>'+esc(group)+'<span class="group-count">'+layers.length+' layere</span></summary>';if(group==="Camerete"){const legend=document.createElement("div");legend.className="owner-legend";legend.innerHTML='<span class="owner-key" style="--key:#22c55e">OSC</span><span class="owner-key" style="--key:#ef4444">SPT / SPL</span><span class="owner-key" style="--key:#ff7900">ORO</span><span class="owner-key" style="--key:#e6007e">OROC</span><span class="owner-key" style="--key:#2f80ed">3th Party</span>';details.append(legend)}layers.forEach(layer=>{const label=document.createElement("label");label.className="layer";label.style.setProperty("--color",layer.color||colors[layer.colorIndex%colors.length]);label.innerHTML='<input type="checkbox" '+(active.has(layer.id)?"checked":"")+'><span class="dot"></span><span class="name">'+esc(layer.name)+'<span class="meta">'+layer.features.toLocaleString("ro")+' obiecte</span></span>';const input=label.querySelector("input");input.addEventListener("change",async()=>{input.checked?active.add(layer.id):active.delete(layer.id);const old=visible.get(layer.id);if(old){map.removeLayer(old);visible.delete(layer.id)}if(input.checked&&searchCenter){await showLayer(layer,searchCenter,searchRun);updateResultCount()}});details.append(label)});root.append(details)})}
    function updateResultCount(){let n=0;visible.forEach(layer=>layer.eachLayer(()=>n++));resultTotal.textContent=n.toLocaleString("ro")+" rezultate"}
    fetch("layers.json").then(r=>r.json()).then(data=>{manifest=data;const groups=[...new Set(data.layers.map(l=>l.group))].sort();data.layers.forEach(l=>{l.colorIndex=groups.indexOf(l.group);if(!l.id.startsWith("fo-"))active.add(l.id)});document.getElementById("layer-total").textContent=active.size+" din "+data.totals.layers+" layere selectate";render();status.textContent="Introdu o adresă sau coordonate pentru a vedea elementele din raza de 10 km."}).catch(()=>{status.textContent="Lista de layere nu a putut fi încărcată."});
    document.getElementById("place-form").addEventListener("submit",async e=>{e.preventDefault();status.textContent="Se caută locația…";status.hidden=false;try{const found=await locate(document.getElementById("place").value);await searchArea(found.center,found.label)}catch(error){status.textContent=error.message}});
    document.getElementById("locate-me").addEventListener("click",()=>{const button=document.getElementById("locate-me");if(!navigator.geolocation){status.textContent="Localizarea nu este disponibilă în acest browser.";status.hidden=false;return}button.disabled=true;button.textContent="Se localizează…";status.textContent="Se solicită locația curentă…";status.hidden=false;navigator.geolocation.getCurrentPosition(async position=>{button.disabled=false;button.textContent="⌖ Locația mea";const center={lat:position.coords.latitude,lng:position.coords.longitude};document.getElementById("place").value=center.lat.toFixed(6)+", "+center.lng.toFixed(6);await searchArea(center,"Locația mea")},error=>{button.disabled=false;button.textContent="⌖ Locația mea";status.textContent=error.code===1?"Accesul la locație a fost refuzat.":"Locația curentă nu a putut fi determinată.";status.hidden=false},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})});
    document.getElementById("site-form").addEventListener("submit",async e=>{e.preventDefault();status.textContent="Se caută codul de site…";status.hidden=false;try{await searchSite(document.getElementById("site-code").value)}catch(error){status.textContent=error.message}});
    function formatDistance(meters){return meters<1000?Math.round(meters)+" m":(meters/1000).toLocaleString("ro",{minimumFractionDigits:2,maximumFractionDigits:2})+" km"}
    function renderMeasurement(){measureGroup.clearLayers();if(measurePoints.length>1)L.polyline(measurePoints,{color:"#52e0ff",weight:4,dashArray:"8 7"}).addTo(measureGroup);let total=0;measurePoints.forEach((point,index)=>{if(index)total+=point.distanceTo(measurePoints[index-1]);const marker=L.circleMarker(point,{radius:6,color:"#061017",weight:2,fillColor:"#52e0ff",fillOpacity:1}).addTo(measureGroup);marker.bindTooltip(index?formatDistance(total):"Start",{permanent:true,direction:"top",className:"measure-tooltip"}).openTooltip()})}
    function addMeasurementEndMarker(){if(measurePoints.length<2)return;const point=measurePoints.at(-1),total=measurePoints.slice(1).reduce((sum,current,index)=>sum+current.distanceTo(measurePoints[index]),0),maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(point.lat+","+point.lng);L.marker(point,{title:"Sfârșitul măsurătorii",zIndexOffset:1100}).addTo(measureGroup).bindPopup('<div class="popup-title">Sfârșitul măsurătorii</div><div class="popup-grid"><span>Distanță totală</span><strong>'+formatDistance(total)+'</strong><span>Coordonate</span><strong>'+point.lat.toFixed(6)+", "+point.lng.toFixed(6)+'</strong></div><a class="maps-link" href="'+maps+'" target="_blank" rel="noopener noreferrer">Deschide în Google Maps</a>').openPopup()}
    function setMeasuring(value){measuring=value;measureButton.classList.toggle("active",value);measureButton.textContent=value?"✓ Măsurare activă":"📏 Liniar";map.getContainer().style.cursor=value?"crosshair":"";if(!value)addMeasurementEndMarker();status.textContent=value?"Apasă succesiv pe hartă pentru a măsura. Apasă din nou pe Liniar pentru a termina.":"Măsurarea a fost încheiată.";status.hidden=false;if(!value)setTimeout(()=>status.hidden=true,2200)}
    measureButton.addEventListener("click",()=>{if(!measuring){measurePoints=[];measureGroup.clearLayers()}setMeasuring(!measuring)});
    document.getElementById("clear-markers").addEventListener("click",()=>{searchMarkers.clearLayers();measureGroup.clearLayers();measurePoints=[];lastSearchMarker=null;if(measuring)setMeasuring(false);status.textContent="Marcajele și măsurătorile au fost șterse.";status.hidden=false;setTimeout(()=>status.hidden=true,2200)});
    document.getElementById("layer-search").addEventListener("input",e=>render(e.target.value));document.getElementById("all").addEventListener("click",()=>{manifest.layers.forEach(l=>active.add(l.id));render(document.getElementById("layer-search").value);if(searchCenter)searchArea(searchCenter,"Căutare curentă",{pin:false,fit:false})});document.getElementById("none").addEventListener("click",()=>{active.clear();visible.forEach(l=>map.removeLayer(l));visible.clear();render(document.getElementById("layer-search").value);updateResultCount()});document.getElementById("collapse").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("collapsed"));
    map.on("autopanstart",()=>{popupAutoPan=true;clearTimeout(moveTimer)});map.on("popupopen",()=>clearTimeout(moveTimer));
    map.on("click",event=>{if(measuring){measurePoints.push(event.latlng);renderMeasurement()}});document.addEventListener("keydown",event=>{if(event.key==="Escape"&&measuring)setMeasuring(false)});map.on("zoomend",updateSiteLabels);map.on("move",()=>{updateSiteLabels();if(popupAutoPan||suppressMove||!searchCenter)return;clearTimeout(moveTimer);moveTimer=setTimeout(refreshFromMap,550)});map.on("moveend",()=>{clearTimeout(moveTimer);updateSiteLabels();if(popupAutoPan){popupAutoPan=false;return}if(suppressMove){suppressMove=false;return}if(searchCenter)moveTimer=setTimeout(refreshFromMap,100)});
    if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
  </script>
